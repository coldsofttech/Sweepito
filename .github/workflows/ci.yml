name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: windows-latest, python: "3.11" }
          - { os: macos-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --locked
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Unit tests
        run: uv run --python ${{ matrix.python }} pytest tests/unit -n auto --no-cov
      - name: Integration tests
        run: uv run --python ${{ matrix.python }} pytest tests/integration -n auto --no-cov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*

  # Single required status check for the branch ruleset.
  ci:
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "lint:  ${{ needs.lint.result }}"
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.test.result }}" = success ] &&
          [ "${{ needs.build.result }}" = success ]
