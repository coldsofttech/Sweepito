name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          package=$(grep -m1 '__version__' src/sweepito/__init__.py | cut -d'"' -f2)
          test "$tag" = "$pyproject" && test "$tag" = "$package" \
            || { echo "Version mismatch: tag=$tag pyproject=$pyproject package=$package"; exit 1; }
      - run: uv sync
      - run: uv run ruff check .
      - run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          uv run pytest -n auto

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
