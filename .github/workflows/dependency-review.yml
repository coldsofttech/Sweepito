name: Dependency review

# Reviews dependency changes in pull requests for known vulnerabilities, for both the Python
# project (python/uv.lock) and the VS Code extension (extensions/vscode/package-lock.json). The
# action reviews every manifest changed in the pull request in one pass, so one job covers both.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependencies for known vulnerabilities
        uses: actions/dependency-review-action@v5
