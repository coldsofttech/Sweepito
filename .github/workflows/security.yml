name: Security

# Static analysis (Semgrep) for the Python project and the VS Code extension. Findings are
# uploaded as SARIF, so they show up in the repository's Security tab (Code scanning), and the
# job fails when it finds a problem. This job is not part of the required `ci` check, so a new
# rule does not block unrelated pull requests. The weekly run catches rules added after a merge.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Actions are pinned to version tags on purpose (Dependabot keeps them current), so the
      # rule that asks for commit SHAs is excluded.
      - name: Run Semgrep
        run: >
          pipx run semgrep scan
          --config p/python
          --config p/javascript
          --config p/nodejs
          --config p/owasp-top-ten
          --config p/github-actions
          --exclude tests
          --exclude test
          --exclude node_modules
          --exclude dist
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          --error
          --sarif --output semgrep.sarif
          .
      - name: Upload results
        if: always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
