name: Bug report
description: Something did not behave as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If Sweepito deleted something it should not have (a tracked file, or anything
        outside the project), please use **private vulnerability reporting** from the
        Security tab instead of this form.
  - type: dropdown
    id: component
    attributes:
      label: Where did it happen?
      options:
        - CLI (Python package)
        - Installer (Windows setup.exe, Linux deb/rpm)
        - VS Code extension
        - Profiles or rules
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        CLI and installers: the command, plus `sweepito scan --json -v` output if relevant.
        VS Code extension: the command or view you used, plus the "Sweepito" output channel
        (View > Output) if relevant.
      render: shell
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        Contents of `sweepito.toml` (or `[tool.sweepito]`), and for the VS Code extension any
        `sweepito.*` settings you changed, if you have them.
      render: toml
  - type: input
    id: version
    attributes:
      label: Sweepito version
      description: |
        CLI and installers: output of `sweepito --version`.
        VS Code extension: the extension version from the Extensions view.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and Git versions
      description: Not needed for the VS Code extension, which does not use Python.
      placeholder: "Python 3.12.4, git 2.45.0"
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      description: VS Code extension only. Help > About.
      placeholder: "1.146.0"
