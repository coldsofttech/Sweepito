name: Feature request
description: Suggest an improvement to the tool itself
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
