[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweepito"
version = "0.1.0"
description = "Safely clean caches and build artifacts across languages, frameworks and tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "coldsofttech" }]
keywords = ["cleanup", "cache", "build", "pre-commit", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pathspec>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/coldsofttech/Sweepito"
Issues = "https://github.com/coldsofttech/Sweepito/issues"

[project.scripts]
sweepito = "sweepito.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
    "pre-commit>=3",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/sweepito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "e2e: tests that run the installed command line program",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]   # long documentation prose
