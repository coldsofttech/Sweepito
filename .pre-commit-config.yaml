repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory python mypy
        language: system
        types: [python]
        files: ^python/src/
        pass_filenames: false
        require_serial: true
      - id: pytest-unit
        name: pytest (unit)
        entry: uv run --directory python pytest tests/unit -q --no-cov
        language: system
        types: [python]
        files: ^python/
        pass_filenames: false
        require_serial: true
      - id: vscode-lint
        name: eslint and prettier (VS Code extension)
        entry: npm --prefix extensions/vscode run lint
        language: system
        files: ^extensions/vscode/
        pass_filenames: false
        require_serial: true
      - id: license-copies
        name: LICENSE copies match the root LICENSE
        entry: python -c "import filecmp, sys; sys.exit(0 if all(filecmp.cmp('LICENSE', p, shallow=False) for p in ('python/LICENSE', 'extensions/vscode/LICENSE')) else 1)"
        language: python
        files: ^(LICENSE|python/LICENSE|extensions/vscode/LICENSE)$
        pass_filenames: false
