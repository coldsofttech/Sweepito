# These hooks run the `sweepito` command, which must already be installed and on PATH
# (pipx install sweepito, uv tool install sweepito, or a native installer).
- id: sweepito-scan
  name: sweepito scan
  description: Report git-ignored caches and build artifacts that could be cleaned.
  entry: sweepito scan --hook --quiet
  language: system
  stages: [pre-commit]
  pass_filenames: false
  always_run: true

- id: sweepito-clean
  name: sweepito clean
  description: Remove git-ignored caches and build artifacts after each commit.
  entry: sweepito clean --hook --non-interactive --quiet
  language: system
  stages: [post-commit]
  pass_filenames: false
  always_run: true
